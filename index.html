<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatat Keuangan Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Pencatat Keuangan Sederhana</h2>
        
        <!-- Kartu Ringkasan Saldo -->
        <div class="summary-cards">
            <div class="card saldo">
                <h3>Total Saldo</h3>
                <p id="total-saldo">Rp 0</p>
            </div>
            <div class="card income">
                <h3>Pemasukan</h3>
                <p id="total-pemasukan">Rp 0</p>
            </div>
            <div class="card expense">
                <h3>Pengeluaran</h3>
                <p id="total-pengeluaran">Rp 0</p>
            </div>
        </div>

        <!-- Form Input Transaksi -->
        <div class="form-container">
            <h3>Tambah Transaksi Baru</h3>
            <form id="form-transaksi">
                <div class="input-group">
                    <label for="keterangan">Keterangan</label>
                    <input type="text" id="keterangan" placeholder="Contoh: Gaji Bulanan, Beli Makan..." required>
                </div>
                <div class="input-group">
                    <label for="jumlah">Jumlah (Rp)</label>
                    <input type="number" id="jumlah" placeholder="Contoh: 50000" required>
                </div>
                <div class="input-group">
                    <label for="tipe">Jenis Transaksi</label>
                    <select id="tipe">
                        <option value="pemasukan">Pemasukan</option>
                        <option value="pengeluaran">Pengeluaran</option>
                    </select>
                </div>
                <button type="submit" class="btn-tambah">Tambah Transaksi</button>
            </form>
        </div>

        <!-- Tabel Riwayat Transaksi -->
        <div class="history-container">
            <h3>Riwayat Transaksi</h3>
            <table>
                <thead>
                    <tr>
                        <th>Keterangan</th>
                        <th>Jumlah</th>
                        <th>Jenis</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="daftar-transaksi">
                    <!-- Data transaksi akan dimasukkan otomatis oleh JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
